[project]
name = "rythu-weather"
version = "0.1.0"
description = "Rythu weather service — honest Open-Meteo forecast + farming-read for Bhupalpally (hexagonal, AWS Lambda)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "azure-data-tables>=12.7.0",
    "azure-identity>=1.26.0",
    "fastapi>=0.143.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
    "uvicorn>=0.54.0",
    "azure-functions>=1.25.0,<2",
]
functions = [
    "azure-functions>=1.25.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rythu_weather"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Rythu is Telugu-first and carries intentional typography (en-dashes, ~, °); the
# ambiguous-Unicode rules would flag every non-ASCII farmer-facing string.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rythu_weather"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true

# boto3/botocore are provided by the AWS Lambda runtime and imported lazily in the DynamoDB
# cache adapter; they are not build dependencies, so they have no stubs here.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: hits the real Open-Meteo API (network required)",
]
