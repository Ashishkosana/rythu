name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend · ruff + mypy(strict) + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/weather
    # Azurite = Microsoft's Storage emulator, so the Table Storage cache adapter is tested against
    # the real protocol. Pinned to the same version the tests document for local runs.
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports:
          - 10002:10002
    env:
      RYTHU_REQUIRE_AZURITE: "1" # missing emulator = failed build, never a silent skip
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Tests (pytest)
        run: uv run pytest

  infra:
    name: infra · bicep build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner image ships the Azure CLI; `az bicep` fetches the Bicep compiler on first use.
      # Compiles and lints only — no Azure login, nothing is deployed.
      - name: Build (compile to ARM)
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null
      - name: Lint
        run: az bicep lint --file infra/azure/main.bicep

  frontend:
    name: frontend · lint + tsc + vitest + build + budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life in April 2026; 22 is the maintained LTS.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      # lib/api.gen.ts must be generated from services/weather/openapi.json (whose own freshness
      # is checked by the backend's pytest). Fails if someone changed the contract without regenerating.
      - name: API types up to date (openapi-typescript --check)
        run: npm run check:api
      # Ask Rythu answers only from the app's own content: the API's copy of it must match the screens.
      - name: Ask Rythu corpus up to date (export-corpus --check)
        run: npm run check:corpus
      - name: Types (tsc)
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npm run test
      - name: Build (static export + service worker + SWA config)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Performance budget (first-load JS per page ≤ 170 KB gz)
        run: npm run check:budget
      # Gate on what ships to phones. Dev-tool advisories are handled by Dependabot
      # rather than failing unrelated pushes.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
