name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend · ruff + mypy(strict) + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/weather
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Tests (pytest)
        run: uv run pytest

  frontend:
    name: frontend · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests (vitest)
        run: npm run test
