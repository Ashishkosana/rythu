name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend · ruff + mypy(strict) + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/weather
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Tests (pytest)
        run: uv run pytest

  frontend:
    name: frontend · lint + tsc + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life in April 2026; 22 is the maintained LTS.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      # lib/api.gen.ts must be generated from services/weather/openapi.json (whose own freshness
      # is checked by the backend's pytest). Fails if someone changed the contract without regenerating.
      - name: API types up to date (openapi-typescript --check)
        run: npm run check:api
      - name: Types (tsc)
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npm run test
      - name: Build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Gate on what ships to phones. Dev-tool advisories are handled by Dependabot
      # rather than failing unrelated pushes.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
