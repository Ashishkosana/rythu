name: Deploy (Azure)

# Code deploys only. Infrastructure (infra/azure/main.bicep) is applied by a human from Cloud Shell:
# it creates role assignments, and the deploy identities deliberately cannot (least privilege).
on:
  # After CI succeeds on main — deploy exactly the commit CI tested.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Or by hand, from the Actions tab.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  # Production (S10): the same commit, after dev passed its smoke tests — and after a person approves
  # (required reviewers on the GitHub Environment "prod"). Off until AZURE_PROD_ENABLED is "true".
  prod:
    needs: dev
    if: vars.AZURE_PROD_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
